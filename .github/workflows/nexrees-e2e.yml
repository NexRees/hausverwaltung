# nexrees: unit tests and Playwright end-to-end UI tests on every pull request.
# The E2E job builds the app, starts it against an empty Postgres with the demo seed plus the
# NexRees staff logins (npm run e2e:seed), and drives it in Chromium as each role. On failure the
# HTML report with traces and screenshots is attached to the run ("playwright-report").
name: Tests

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  unit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      # Same install as the upstream sync: npm 11 without --legacy-peer-deps, so vitest's peer
      # dependency vite is installed (with --legacy-peer-deps vitest cannot start).
      - run: npx --yes npm@11 ci
      - run: npx prisma generate
      - run: npm test

  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: havewa
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/havewa
      AUTH_SECRET: ci-only-auth-secret-not-used-anywhere-else
      AUTH_TRUST_HOST: "true"
      APP_ENV: ci
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci --legacy-peer-deps
      - run: npx prisma generate

      - name: Seed test data
        run: npm run e2e:seed

      - name: Build
        run: npm run build

      - name: Cache Playwright browsers
        id: pw-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: pw-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
      - name: Install Chromium
        run: |
          if [ "${{ steps.pw-cache.outputs.cache-hit }}" = "true" ]; then
            npx playwright install-deps chromium
          else
            npx playwright install --with-deps chromium
          fi

      - name: Run E2E tests
        run: npm run e2e

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: |
            e2e/.report
            e2e/.results
          retention-days: 14
